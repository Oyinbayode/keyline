name: Release

# Changesets flow: merging changesets into main opens (or updates) a
# "Version Packages" PR. Merging that PR publishes to npm with trusted
# publishing (OIDC) and pushes the `@oyinbayode/keyline@x.y.z` tag and GitHub
# release. There is no npm token anywhere: npm swaps this job's GitHub OIDC
# token for a short-lived publish token, which 2FA-on-publish accepts.
#
# Publish path: `changeset publish` sees pnpm-lock.yaml and runs
# `pnpm publish <tarball>`; pnpm 10 hands a tarball straight to the `npm` on
# PATH, so the npm version below is what has to speak OIDC (>= 11.5.1).
#
# Jobs follow the Changesets trusted-publishing layout so `id-token: write`
# exists only on the job that publishes, and that job runs no build scripts.

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  select-mode:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
      publish-plan-artifact-id: ${{ steps.select-mode.outputs.publish-plan-artifact-id }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - id: select-mode
        uses: changesets/action/select-mode@v2

  version:
    if: needs.select-mode.outputs.mode == 'version'
    needs: select-mode
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action/version@v2
        with:
          commit-message: 'chore: version packages'
          pr-title: 'chore: version packages'

  pack:
    if: needs.select-mode.outputs.mode == 'publish'
    needs: select-mode
    runs-on: ubuntu-latest
    outputs:
      pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm check:package
      - id: pack
        uses: changesets/action/pack@v2
        with:
          publish-plan-artifact-id: ${{ needs.select-mode.outputs.publish-plan-artifact-id }}

  publish:
    needs: pack
    runs-on: ubuntu-latest
    # Must match the trusted publisher registered on npmjs.com, which names
    # this file (release.yml) and no environment.
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      # No registry-url: setup-node would write an .npmrc with a placeholder
      # token, and npm would send that instead of exchanging the OIDC token.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      # Pinned, not "latest", so a broken npm release cannot break publishing.
      - run: npm install --global npm@11.19.1
      - run: npm --version
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # npm treats a failed OIDC exchange as "no OIDC" and logs why only at
      # verbose level, so a registry-side mismatch surfaces later as a bare
      # ENEEDAUTH. Dry-run the packed tarball first (the exchange runs before
      # the dry-run check) and stop with npm's own reason if it fails.
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.pack.outputs.pack-dir-artifact-id }}
          path: ${{ runner.temp }}/oidc-preflight
      - name: Check the npm OIDC exchange
        run: |
          tarball=$(find "$RUNNER_TEMP/oidc-preflight" -name '*.tgz' -print -quit)
          if [ -z "$tarball" ]; then
            echo "Nothing to publish to npm; skipping the check."
            exit 0
          fi
          oidc=$(npm publish "$tarball" --dry-run --loglevel verbose 2>&1 | grep 'verbose oidc' || true)
          echo "$oidc"
          if ! grep -q 'Successfully retrieved and set token' <<< "$oidc"; then
            echo "::error::npm could not exchange this job's OIDC token for a publish token. Check the trusted publisher on npmjs.com against this repository, workflow file and environment."
            exit 1
          fi
      - uses: changesets/action/publish@v2
        with:
          pack-dir-artifact-id: ${{ needs.pack.outputs.pack-dir-artifact-id }}
        env:
          # Trusted publishing attests public packages by default; asking for
          # it explicitly makes npm fail rather than publish unattested if the
          # OIDC environment is ever missing.
          NPM_CONFIG_PROVENANCE: 'true'
